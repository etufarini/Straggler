[package]
name = "mir-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Mir.cpp local desktop chat"

[lib]
name = "mir_desktop"

[[bin]]
name = "mir-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
native-tests = ["desktop", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri-plugin-wdio-webdriver = { version = "=1.0.0", optional = true }
tauri = { version = "2", optional = true , features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
