[package]
name = "straggler-desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "Straggler local desktop chat"

[lib]
name = "straggler_desktop"

[[bin]]
name = "straggler-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:ashpd"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
native-tests = ["desktop", "dep:tauri-plugin-wdio-webdriver"]
packaging-probe = []
app-store = ["dep:objc2", "dep:objc2-foundation"]

[dependencies]
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
whatlang = "=0.18.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chardetng = "=0.1.17"
encoding_rs = "0.8"
base64 = "0.22"
async-trait = "0.1"
httpdate = "=1.0.3"
url = { version = "2", features = ["serde"] }
dom_smoothie = "0.19"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
calamine = "0.36.1"
pdf-extract = "0.12.1"
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.0.0", optional = true }
tauri = { version = "2", optional = true , features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10.9"
keyring-core = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.0", optional = true, default-features = false, features = ["tokio", "file_chooser"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain", "protected"] }
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL", "NSPathUtilities"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

# Tests inherit dev; retain useful backtraces without large incremental caches.
[profile.dev]
debug = "limited"
incremental = false
