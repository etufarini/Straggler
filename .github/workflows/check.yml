name: Straggler checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      packaging:
        description: Build and verify pinned backend packages without models
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-packaging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.packaging }}
    uses: ./.github/workflows/backend-packaging.yml
  frontend:
    name: Frontend without native build tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: straggler/desktop/package-lock.json
      - name: Frontend dependencies
        working-directory: straggler/desktop
        run: npm ci --no-audit --no-fund
      - name: Frontend checks
        run: bash straggler/tests/run.sh frontend
  check:
    name: Runtime and native GUI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: straggler/desktop/package-lock.json
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 shellcheck libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb dbus-daemon
      - name: Install macOS check dependencies
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Desktop dependencies
        working-directory: straggler/desktop
        run: npm ci --no-audit --no-fund
      - name: Browser system dependencies
        working-directory: straggler/desktop
        run: npx playwright install-deps chromium webkit
      - name: Download test browsers
        working-directory: straggler/desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium webkit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Browser download failed after three attempts." >&2
              exit 1
            fi
            echo "Browser download failed; retrying after $((attempt * 10)) seconds." >&2
            sleep "$((attempt * 10))"
          done
      - name: Shared checks
        run: bash straggler/tests/run.sh common
      - name: Rust runtime without GUI or inference
        run: bash straggler/tests/run.sh runtime
      - name: Browser flows on the host platform
        run: bash straggler/tests/run.sh browser
      - name: Native window on Linux
        if: runner.os == 'Linux'
        # Xvfb supplies a display, but no desktop session or GPU compositor.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a dbus-run-session -- bash straggler/tests/run.sh native
      - name: Native window on macOS
        if: runner.os == 'macOS'
        run: bash straggler/tests/run.sh native
      - name: Retain browser and native-window evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-checks-${{ matrix.os }}
          path: straggler/desktop/test-results/
          if-no-files-found: warn
