name: Mir.cpp checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Wrapper and GUI on ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suite: linux
          - os: macos-15
            suite: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mir/desktop/package-lock.json
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl tar gzip iproute2 procps util-linux python3 shellcheck libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb dbus-daemon
      - name: Install macOS check dependencies
        if: runner.os == 'macOS'
        run: brew install bash coreutils findutils flock shellcheck
      - name: Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Desktop dependencies
        working-directory: mir/desktop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Shared checks
        run: bash mir/tests/run.sh common
      - name: Platform checks
        run: bash mir/tests/run.sh "${{ matrix.suite }}"
      - name: Desktop checks without inference
        run: bash mir/tests/run.sh desktop
      - name: Native window on Linux
        if: runner.os == 'Linux'
        # Xvfb supplies a display, but no desktop session or GPU compositor.
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a bash mir/tests/run.sh native
      - name: Native window on macOS
        if: runner.os == 'macOS'
        run: bash mir/tests/run.sh native
