name: Straggler checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend without native build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: straggler/desktop/package-lock.json
      - name: Frontend dependencies
        working-directory: straggler/desktop
        run: npm ci --no-audit --no-fund
      - name: Use the Ubuntu distribution archive
        if: runner.os == 'Linux'
        # Regional runner mirrors can exhaust the job limit before tests.
        run: |
          rewrite='s@https?://([a-z0-9.-]+\.)?(ec2|azure)\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g'
          sudo sed -i -E "$rewrite" /etc/apt/sources.list.d/ubuntu.sources
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i -E "$rewrite" /etc/apt/apt-mirrors.txt
          fi
      - name: Check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shared checks
        run: bash straggler/tests/run.sh common
      - name: Frontend checks
        run: bash straggler/tests/run.sh frontend
      - name: Browser dependencies
        working-directory: straggler/desktop
        run: npx playwright install --with-deps webkit
      - name: Shared browser interactions
        run: bash straggler/tests/run.sh browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-linux
          path: straggler/desktop/test-results/browser/
          if-no-files-found: warn
  check:
    name: Runtime and native GUI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: straggler/desktop/package-lock.json
      - name: Use the Ubuntu distribution archive
        if: runner.os == 'Linux'
        # Regional runner mirrors can exhaust the job limit before tests.
        run: |
          rewrite='s@https?://([a-z0-9.-]+\.)?(ec2|azure)\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g'
          sudo sed -i -E "$rewrite" /etc/apt/sources.list.d/ubuntu.sources
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i -E "$rewrite" /etc/apt/apt-mirrors.txt
          fi
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb dbus-daemon
      - name: Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: straggler/desktop/src-tauri -> target
      - name: Desktop dependencies
        working-directory: straggler/desktop
        run: npm ci --no-audit --no-fund
      - name: Rust runtime without GUI or inference
        run: bash straggler/tests/run.sh runtime
      - name: Native window and process lifecycle
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        # The runner supplies Xvfb and a private D-Bus session on headless Linux.
        run: bash straggler/tests/run.sh native
      - name: macOS browser dependencies
        if: runner.os == 'macOS'
        working-directory: straggler/desktop
        run: npx playwright install webkit
      - name: macOS keyboard and focus regressions
        if: runner.os == 'macOS'
        run: bash straggler/tests/run.sh browser-platform
      - name: Retain native and platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-checks-${{ matrix.os }}
          path: straggler/desktop/test-results/
          if-no-files-found: warn
