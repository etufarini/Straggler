name: Mir.cpp checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      packaging:
        description: Build and verify pinned backend packages without models
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-packaging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.packaging }}
    uses: ./.github/workflows/backend-packaging.yml
  check:
    name: Desktop on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mir/desktop/package-lock.json
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 shellcheck libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb dbus-daemon
      - name: Install macOS check dependencies
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Desktop dependencies
        working-directory: mir/desktop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Offline packaging and native platform checks
        run: bash mir/tests/run.sh packaging
      - name: Desktop checks without inference
        run: bash mir/tests/run.sh desktop
      - name: Native window on Linux
        if: runner.os == 'Linux'
        # Xvfb supplies a display, but no desktop session or GPU compositor.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a dbus-run-session -- bash mir/tests/run.sh native
      - name: Native window on macOS
        if: runner.os == 'macOS'
        run: bash mir/tests/run.sh native
